name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar arquivo principal
        run: |
          test -f arquivo-inexistente.html
          echo "index.html encontrado!"

      - name: Finalizar validação
        run: echo "Todos os testes passaram!"
